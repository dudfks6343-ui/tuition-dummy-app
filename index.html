<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>학자금 한눈에 보기 (더미)</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:"Malgun Gothic",sans-serif;background:#f3f5f9;color:#1d2433}
.wrap{max-width:960px;margin:0 auto;padding:20px 16px}
h1{font-size:22px;margin:0 0 4px}
.sub{color:#6b7488;font-size:13px;margin-bottom:16px}
.tabs{display:flex;gap:8px;margin-bottom:16px}
.tabs button{flex:1;padding:12px;border:0;border-radius:10px;background:#fff;font-size:16px;font-weight:bold;cursor:pointer;color:#6b7488}
.tabs button.on{background:#2f6df6;color:#fff}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.card{background:#fff;border-radius:12px;padding:14px;text-align:center}
.card b{display:block;font-size:26px;margin-top:4px}
.card span{font-size:12px;color:#6b7488}
.card.ok b{color:#1a9d5a}.card.wait b{color:#e08a00}
input{width:100%;padding:12px;border:1px solid #d5dbe6;border-radius:10px;font-size:15px;margin-bottom:12px}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden}
th{background:#e9eef8;font-size:13px;padding:10px;text-align:left}
td{padding:11px 10px;border-top:1px solid #eef1f6;font-size:14px}
td.n{text-align:right;font-weight:bold}
.tag{padding:3px 9px;border-radius:99px;font-size:12px;font-weight:bold}
.tag.ok{background:#dff5e8;color:#1a9d5a}.tag.wait{background:#fff0d6;color:#c77700}
@media(max-width:600px){.cards{grid-template-columns:repeat(2,1fr)}td,th{font-size:12px;padding:8px 6px}}
</style>
</head>
<body>
<div class="wrap">
  <h1>자녀 학자금 한눈에 보기</h1>
  <div class="sub">※ 모든 이름·학교·금액은 가상의 예시입니다 (2026년 2학기)</div>
  <div class="tabs" id="tabs"></div>
  <div class="cards" id="cards"></div>
  <input id="q" placeholder="직원·자녀·학교 검색">
  <table>
    <thead><tr><th>직원</th><th>자녀</th><th>학교</th><th>학기</th><th style="text-align:right">금액(만원)</th><th>상태</th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
</div>
<script>
const DATA={
 "가온해운":[
  ["김민준","김서연","한빛대학교 경영학과","3학년 1학기",250,1],
  ["이도현","이하윤","새론대학교 컴퓨터공학과","2학년 1학기",350,1],
  ["박지훈","박예린","누리여자대학교 디자인학과","4학년 1학기",500,0],
  ["최수아","최건우","푸른대학교 기계공학과","1학년 1학기",250,1],
  ["정우진","정다온","한빛대학교 간호학과","2학년 1학기",350,0],
  ["강하늘","강시우","미래대학교 건축학과","3학년 1학기",500,1]
 ],
 "누리라인":[
  ["윤서진","윤채원","새론대학교 국어교육과","1학년 1학기",250,1],
  ["장태민","장지안","푸른대학교 화학과","4학년 1학기",350,0],
  ["임보람","임주원","한빛대학교 통계학과","2학년 1학기",250,1],
  ["한도영","한소율","미래대학교 영상학과","3학년 1학기",350,1],
  ["오세린","오이안","누리여자대학교 약학과","2학년 1학기",500,0]
 ]
};
let cur="가온해운";
const $=id=>document.getElementById(id);
function render(){
  $("tabs").innerHTML=Object.keys(DATA).map(c=>`<button class="${c===cur?"on":""}" onclick="cur='${c}';render()">${c}</button>`).join("");
  const q=$("q").value.trim(), all=DATA[cur];
  const list=all.filter(r=>!q||r.slice(0,3).join(" ").includes(q));
  const sum=all.reduce((s,r)=>s+r[4],0), done=all.filter(r=>r[5]).length;
  $("cards").innerHTML=
   `<div class="card"><span>신청 인원</span><b>${all.length}명</b></div>`+
   `<div class="card"><span>총 지급액</span><b>${sum.toLocaleString()}만</b></div>`+
   `<div class="card ok"><span>지급 완료</span><b>${done}건</b></div>`+
   `<div class="card wait"><span>처리 대기</span><b>${all.length-done}건</b></div>`;
  $("rows").innerHTML=list.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td><td class="n">${r[4]}</td><td><span class="tag ${r[5]?"ok":"wait"}">${r[5]?"완료":"대기"}</span></td></tr>`).join("")||`<tr><td colspan="6">검색 결과 없음</td></tr>`;
}
$("q").oninput=render;
render();
</script>
</body>
</html>
